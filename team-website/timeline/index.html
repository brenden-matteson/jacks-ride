<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue&Gold Transit Collective</title>
    <link rel="stylesheet" href="../public/styles/main.css">
    <style>
    .timeline-container {
        display: flex;
        align-items: stretch;
        height: 500px;
    }

    .timeline {
        position: relative;
        width: 60px;
        flex-shrink: 0;
    }

    .timeline::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 25px;
        bottom: 25px;
        width: 6px;
        background-color: #333;
        transform: translateX(-50%);
    }

    .top-arrow {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);

        width: 0;
        height: 0;
        border-left: 18px solid transparent;
        border-right: 18px solid transparent;
        border-bottom: 30px solid #333;
    }

    .bottom-arrow {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);

        width: 0;
        height: 0;
        border-left: 18px solid transparent;
        border-right: 18px solid transparent;
        border-top: 30px solid #333;
    }

    .content {
        padding-left: 30px;
    }
    </style>
</head>

<header>
    <div class="header-container">
        <div class="header-object">

        </div>
        <div class="header-object">

        </div>

        <a class="header-object" href="../codebase/">
            Codebase
        </a>
        <a class="header-object" href="../documentation/">
            Documentation
        </a>
    </div>
</header>

<body>
    <div class="body-container">
    <div class="timeline-container">

        <div class="timeline">
            <div class="top-arrow"></div>
            <div class="bottom-arrow"></div>
        </div>

        <div class="content">
            <h2>Timeline</h2>

        </div>

    </div>
    </div>
</body>
